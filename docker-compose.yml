services:
  kpi-virtual-exhibition:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kpi-queen-rambhai-exhibition
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
